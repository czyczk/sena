[workspace]
resolver = "2"
members = [
    "crates/sena-core",
    "crates/sena-dsp",
    "crates/sena-mux",
    "crates/sena-enc",
    "crates/sena-dec",
    "bins/senaenc",
    "bins/senadec",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
sena-core = { path = "crates/sena-core" }
sena-dsp = { path = "crates/sena-dsp" }
sena-mux = { path = "crates/sena-mux" }
sena-enc = { path = "crates/sena-enc" }
sena-dec = { path = "crates/sena-dec" }
rustfft = "6"
opus-decoder = { path = "../ropus/crates/opus-decoder", default-features = false }
sha2 = "0.10"
rxaac-dec-lib = { path = "../rxaac-dec/crates/rxaac-dec-lib" }

# Release binaries (senaenc/senadec CLIs and the sena-dec staticlib linked
# into the fb2k plugin) are pure compute: enable cross-crate fat LTO and
# one codegen unit. panic stays "unwind" because the staticlib must not
# abort the host process.
[profile.release]
lto = "fat"
codegen-units = 1
